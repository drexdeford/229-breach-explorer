name: Refresh OCR breach data

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: breach-upload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests
      - name: Pull portal data
        run: python scraper.py
      - name: Rebuild data.json
        run: python build_data.py
      - name: Commit if changed
        run: |
          git config user.name "breach-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/data.json
          if git diff --cached --quiet; then
            echo "No data changes this run."
          else
            git commit -m "Auto-refresh breach data ($(date -u +%Y-%m-%d))"
            git push
          fi
